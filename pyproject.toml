[project]
name = "nekotodo"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=2.53.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "tzdata>=2026.3",
    "uvicorn>=0.52.1",
]

[project.scripts]
nekotodo = "nekotodo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nekotodo"]
