# NekoTodo 配置文件示例
# 复制为 config.toml 后按需修改;或用 --config <path> 指定路径,
# 或设 NEKOTODO_CONFIG 环境变量指向它。

[server]
host = "127.0.0.1"
port = 8000
# 允许跨域请求(测试/特殊环境用);true 时服务处理 OPTIONS 预检,允许任意来源。
# 生产环境建议保持 false。
allow_cors = false

[database]
# SQLite 文件路径
path = "./nekotodo.db"

[files]
# 上传文件(图片)的存储目录;按用户分目录,文件名为 UUID
dir = "./uploads"

[auth]
# 必填:JWT 签名密钥,请改为一段足够长的随机字符串
jwt_secret = "change-me-to-a-long-random-string"
algorithm = "HS256"

[llm]
# 语言大模型(拆解循环使用),任意 OpenAI 兼容端点
base_url = "https://api.deepseek.com"
api_key = "sk-xxxx"
model = "deepseek-v4-flash"
timeout_seconds = 120
max_iterations = 100

[vlm]
# 视觉模型(仅用于图片预处理:图片 -> 文字描述),OpenAI 标准。
# 允许留空;留空时若提交了图片,接口会返回 400。
base_url = ""
api_key = ""
model = ""
timeout_seconds = 120

[prompt]
# 拆解系统提示词模板,支持占位符:
#   {source_content} {source_items} {images} {current_time} {timezone}
# 留空或省略则使用内置默认模板。
# default_template = ""

[registration]
# 是否开放公开注册;关闭时只能通过 CLI 手动注册账户
allow_public = false
require_turnstile = false
turnstile_site_key = ""
turnstile_secret_key = ""

[runs]
# DecompositionRun 记录保留窗口(天)
retention_days = 30

# 敏感项可用环境变量覆盖(优先级高于文件):
#   NEKOTODO_AUTH__JWT_SECRET
#   NEKOTODO_LLM__API_KEY
#   NEKOTODO_VLM__API_KEY
#   NEKOTODO_REGISTRATION__TURNSTILE_SECRET_KEY
